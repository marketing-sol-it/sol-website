intro: From building rooftop solar to advising the people who do.
story: >-
  **oikos Solar started in February 2023** as a project of oikos St. Gallen, the
  student association for sustainability in economics and management at HSG. The
  first idea was direct: raise capital, put solar panels on other people's
  roofs, sell the electricity, hand over the installation once it had paid for
  itself.


  Two installations later, we had learned more about permitting, contracting,
  stakeholders and financing than any course could teach. **Since 2025 we apply
  that experience as consultants** for businesses, startups and public
  institutions, and we run events that bring the energy transition onto campus.
vision: >-
  Our vision is to accelerate the energy transition by creating tangible impact
  at the intersection of energy, policy and business.
